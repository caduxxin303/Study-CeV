<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link href="css/style.css" rel="stylesheet">
    <style>
      body {
        font: normal 30pt Arial;
      }
    </style>
  </head>
  <body>
    <script>
      var name = window.prompt('What is your name?')
      document.writeln(`Hi ${name}, your name has ${name.length} letters.`)
      document.writeln(`Your uppercased name is ${name.toUpperCase()}.`)
      document.writeln(`Your lowercased name is ${name.toLowerCase()}.`)
    </script>
  </body>
</html>
